name: snaplens-ai

services:
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:-http://diagnostic-orchestrator:8001}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-90}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-10485760}
      VOICE_ASSISTANT_ENABLED: ${VOICE_ASSISTANT_ENABLED:-false}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      VOICE_ASSISTANT_MAX_CONCURRENT_SESSIONS: ${VOICE_ASSISTANT_MAX_CONCURRENT_SESSIONS:-2}
      VOICE_ASSISTANT_MAX_SESSION_SECONDS: ${VOICE_ASSISTANT_MAX_SESSION_SECONDS:-600}
      DEEPGRAM_LISTEN_MODEL: ${DEEPGRAM_LISTEN_MODEL:-flux-general-en}
      DEEPGRAM_THINK_PROVIDER: ${DEEPGRAM_THINK_PROVIDER:-open_ai}
      DEEPGRAM_THINK_MODEL: ${DEEPGRAM_THINK_MODEL:-gpt-4o-mini}
      DEEPGRAM_THINK_TEMPERATURE: ${DEEPGRAM_THINK_TEMPERATURE:-0.3}
      DEEPGRAM_SPEAK_MODEL: ${DEEPGRAM_SPEAK_MODEL:-aura-2-thalia-en}
      DEEPGRAM_VOICE_LANGUAGE: ${DEEPGRAM_VOICE_LANGUAGE:-en}
      DEEPGRAM_VOICE_GREETING: ${DEEPGRAM_VOICE_GREETING:-Hi, I'm SnapLens. I can help you use the app or troubleshoot a photo. What would you like to do?}
    ports:
      - "8000:8000"
    depends_on:
      diagnostic-orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  diagnostic-orchestrator:
    build:
      context: .
      dockerfile: services/diagnostic-orchestrator/Dockerfile
    expose:
      - "8001"
    environment:
      VISION_SERVICE_URL: ${VISION_SERVICE_URL:-http://vision-service:8002}
      RETRIEVAL_SERVICE_URL: ${RETRIEVAL_SERVICE_URL:-http://retrieval-service:8003}
      SESSION_SERVICE_URL: ${SESSION_SERVICE_URL:-http://session-service:8004}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-10485760}
      ANSWER_PROVIDER: ${ANSWER_PROVIDER:-mock}
      ANSWER_MODEL: ${ANSWER_MODEL:-gemini-3.1-flash-lite}
      ANSWER_PROVIDER_TIMEOUT_SECONDS: ${ANSWER_PROVIDER_TIMEOUT_SECONDS:-30}
      ANSWER_MAX_OUTPUT_TOKENS: ${ANSWER_MAX_OUTPUT_TOKENS:-1024}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      ORCHESTRATOR_SERVICE_TIMEOUT_SECONDS: ${ORCHESTRATOR_SERVICE_TIMEOUT_SECONDS:-35}
    depends_on:
      vision-service:
        condition: service_healthy
      retrieval-service:
        condition: service_healthy
      session-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  vision-service:
    build:
      context: .
      dockerfile: services/vision-service/Dockerfile
    expose:
      - "8002"
    environment:
      VISION_PROVIDER: ${VISION_PROVIDER:-mock}
      VISION_PROVIDER_TIMEOUT_SECONDS: ${VISION_PROVIDER_TIMEOUT_SECONDS:-30}
      VISION_MAX_OUTPUT_TOKENS: ${VISION_MAX_OUTPUT_TOKENS:-512}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-10485760}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  retrieval-service:
    build:
      context: .
      dockerfile: services/retrieval-service/Dockerfile
    expose:
      - "8003"
    environment:
      RETRIEVAL_PROVIDER: ${RETRIEVAL_PROVIDER:-mock}
      RETRIEVAL_PROVIDER_TIMEOUT_SECONDS: ${RETRIEVAL_PROVIDER_TIMEOUT_SECONDS:-15}
      RETRIEVAL_MAX_SNIPPET_CHARS: ${RETRIEVAL_MAX_SNIPPET_CHARS:-4000}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_API_BASE_URL: ${TAVILY_API_BASE_URL:-https://api.tavily.com}
      TAVILY_SEARCH_DEPTH: ${TAVILY_SEARCH_DEPTH:-basic}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  session-service:
    build:
      context: .
      dockerfile: services/session-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-snaplens}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-snaplens}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    expose:
      - "8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snaplens}
      POSTGRES_USER: ${POSTGRES_USER:-snaplens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
